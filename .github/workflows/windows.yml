name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Check filtering, chart placement, signals and updates
        run: dotnet run --project tests/ThinMarketMonitor.Checks -c Release
      - name: Publish standalone Windows x64 EXE
        shell: pwsh
        run: |
          $versionArg = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw 'Release tag must be vMAJOR.MINOR.PATCH.'
            }
            $versionArg = @("-p:Version=$($env:GITHUB_REF_NAME.Substring(1))")
          }
          dotnet publish src/ThinMarketMonitor -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish @versionArg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts/release | Out-Null
          Copy-Item artifacts/publish/ThinMarketMonitor.exe artifacts/release/ThinMarketMonitor-win-x64.exe
          $hash = (Get-FileHash artifacts/release/ThinMarketMonitor-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ThinMarketMonitor-win-x64.exe" | Set-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
      - name: Smoke-test the portable EXE
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'thin-market-monitor-smoke.txt'
          $process = Start-Process ./artifacts/release/ThinMarketMonitor-win-x64.exe -ArgumentList "--smoke-test `"$marker`"" -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out.' }
          if (Test-Path -LiteralPath $marker) { Get-Content -LiteralPath $marker }
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $marker)) { throw "Smoke test failed (exit $($process.ExitCode))." }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ThinMarketMonitor-win-x64
          path: artifacts/release/*
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Fetch verified build and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name ThinMarketMonitor-win-x64 --dir release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $env:GITHUB_REF_NAME ./release/ThinMarketMonitor-win-x64.exe ./release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "Thin Market Monitor $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
